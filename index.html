<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ワッ局 NFシフト調整</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
:root{color-scheme:light}
html,body{margin:0}

/* Layout: sticky green app bar (same green as the original sheet) with three tabs; content is a single column that tops out at 980px; the all-members table scrolls inside its own frame with sticky headers and name column. */
:root{
  --bg:#f3f7f5; --surface:#ffffff; --fg:#17251f; --muted:#576a61; --line:#d6e0da;
  --bar:#2e6b55; --bar-fg:#ffffff;
  --brand:#2e6b55; --brand-fg:#ffffff; --brand-soft:#d9ebe1;
  --danger:#b3372f; --danger-soft:#f9e5e3;
  --me:#fff4c9;
  --g-red:#e8a09a; --g-purple:#8e7cc3; --g-blue:#8fb2ee; --g-none:#b9c2bd;
  --font-body:'Noto Sans JP',system-ui,-apple-system,'Hiragino Sans','Yu Gothic UI',Meiryo,sans-serif;
  --font-head:'Zen Kaku Gothic New','Noto Sans JP',system-ui,'Hiragino Sans','Yu Gothic UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1612; --surface:#17211c; --fg:#e3eee8; --muted:#97aba0; --line:#2a3a32;
    --bar:#1b3a2e; --bar-fg:#e3eee8;
    --brand:#5cb892; --brand-fg:#0c1914; --brand-soft:#1e3b2f;
    --danger:#f08e86; --danger-soft:#3b201e;
    --me:#3a3417;
    --g-red:#c06a63; --g-purple:#7662ad; --g-blue:#527ab5; --g-none:#56635c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1612; --surface:#17211c; --fg:#e3eee8; --muted:#97aba0; --line:#2a3a32;
  --bar:#1b3a2e; --bar-fg:#e3eee8;
  --brand:#5cb892; --brand-fg:#0c1914; --brand-soft:#1e3b2f;
  --danger:#f08e86; --danger-soft:#3b201e;
  --me:#3a3417;
  --g-red:#c06a63; --g-purple:#7662ad; --g-blue:#527ab5; --g-none:#56635c;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:15px;line-height:1.6;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);z-index:30}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.inner{max-width:980px;margin:0 auto}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bar);color:var(--bar-fg)}
.bar .top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:12px}
.bar h1{margin:0;font-family:var(--font-head);font-size:19px;font-weight:700;letter-spacing:.02em}
.bar .meta{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
.tabs{display:flex;gap:4px;margin-top:6px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:8px 12px 7px;color:var(--bar-fg);opacity:.72;font-weight:500;font-size:14px}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--bar-fg);font-weight:700}

main{padding-block:18px 96px}
h2{font-family:var(--font-head);font-size:17px;margin:0;font-weight:700}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.card > h2 + p{margin:4px 0 12px}
.notice{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--brand);border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px}
.notice.bad{border-left-color:var(--danger)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:700}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn.danger.fill{background:var(--danger);color:var(--surface)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text],input[type=search],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}

/* me */
.who{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.who .name{font-family:var(--font-head);font-size:20px;font-weight:700}
.status{font-size:12px;color:var(--muted);min-height:18px;margin-bottom:12px}
.day{margin-bottom:20px}
.day header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:8px}
.slot{display:grid;grid-template-columns:1fr auto;grid-template-rows:auto auto;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;min-height:64px}
.slot .t{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums}
.slot .mark{font-size:24px;line-height:1;color:var(--muted);grid-row:1 / span 2;grid-column:2}
.slot .n{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.slot[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-fg)}
.slot[aria-pressed="true"] .mark,.slot[aria-pressed="true"] .n{color:var(--brand-fg)}
.slot:disabled{opacity:.6}

.picks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:12px}
.pick{text-align:left;border:1px solid var(--line);border-left:6px solid var(--gc,var(--g-none));background:var(--surface);border-radius:8px;padding:10px 12px;font-size:15px}
.g-red{--gc:var(--g-red)} .g-purple{--gc:var(--g-purple)} .g-blue{--gc:var(--g-blue)} .g-none{--gc:var(--g-none)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--brand-soft);border-radius:8px;padding:10px 12px;margin-top:12px}
.confirm.bad{background:var(--danger-soft)}

/* all table */
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:10px;align-items:center}
.legend .sw{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--gc);margin-right:4px;vertical-align:-1px}
.tablewrap{overflow:auto;max-height:calc(100dvh - 210px);min-height:240px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:separate;border-spacing:0;font-size:12px;font-variant-numeric:tabular-nums}
th,td{height:30px;min-width:52px;padding:0 4px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid var(--line);white-space:nowrap;background:var(--surface)}
thead th{position:sticky;z-index:2;font-weight:700}
thead tr:nth-child(1) th{top:0}
thead tr:nth-child(2) th{top:30px;font-weight:500}
thead tr:nth-child(3) th{top:60px;color:var(--brand);font-size:13px}
.namecol{position:sticky;left:0;z-index:1;min-width:116px;max-width:150px;text-align:left;padding:0 8px 0 12px;overflow:hidden;text-overflow:ellipsis;box-shadow:inset 5px 0 0 var(--gc,var(--g-none))}
thead .namecol{z-index:3;box-shadow:none}
td.on{background:var(--brand-soft);color:var(--brand);font-weight:700;font-size:14px}
tr.me td{background:var(--me)}
tr.me td.on{background:var(--brand-soft)}
.dot{color:var(--brand);font-size:9px;margin-left:4px;vertical-align:1px}

/* admin */
.mrow{border-top:1px solid var(--line);padding:12px 0}
.mrow:first-child{border-top:0}
.mrow .line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center}
.mrow .line input{width:100%}
.mrow .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.tag{font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.tag.ok{background:var(--brand-soft);border-color:transparent;color:var(--brand)}
.edgrid{margin-top:10px;display:grid;gap:6px}
.edgrid .d{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.edgrid .d b{min-width:36px;font-size:13px}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;font-variant-numeric:tabular-nums}
.pill[aria-pressed="true"]{background:var(--brand);color:var(--brand-fg);border-color:var(--brand);font-weight:700}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}

.toast{position:fixed;left:50%;transform:translate(-50%,20px);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:40;max-width:calc(100vw - 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast.bad{background:var(--danger);color:#fff}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}

a{color:var(--brand)}
textarea{font:inherit;color:inherit;resize:vertical}

</style>
</head>
<body>
<div id="app"><main class="gut"><div class="inner"><p class="muted">読み込み中…</p></div></main></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:16px">このページはJavaScriptが必要です。</p></noscript>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {
  getFirestore, collection, doc, onSnapshot, query, orderBy,
  updateDoc, setDoc, deleteDoc, writeBatch
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js';
import {
  getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged
} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js';

// ① Firebase の「ウェブアプリ」登録で表示される firebaseConfig を、下の { } の中に貼り付けてください。
//    (この値は公開されても問題ない設計です。守っているのは firestore.rules です)
const firebaseConfig = {
  apiKey: "AIzaSyA9BwL0s6o-alOHyXFM69L_zzdSjE5eagE",

  authDomain: "nfwakkyoku.firebaseapp.com",

  projectId: "nfwakkyoku",

  storageBucket: "nfwakkyoku.firebasestorage.app",

  messagingSenderId: "981102513535",

  appId: "1:981102513535:web:4edf7f27220b00e9095e4a",

  measurementId: "G-9P0LQKRZRE"

};

// データの出し入れをここにまとめています(Firebase / Firestore)。




const configured = !!firebaseConfig.projectId && firebaseConfig.projectId.indexOf('ここ') < 0;
let db = null, auth = null;
if (configured) {
  const app = initializeApp(firebaseConfig);
  db = getFirestore(app);
  auth = getAuth(app);
}

const store = {
  configured: configured,

  subscribeMembers(cb, errCb) {
    return onSnapshot(query(collection(db, 'members'), orderBy('order')), function (sn) {
      cb(sn.docs.map(function (d) { return Object.assign({}, d.data(), { id: d.id }); }));
    }, errCb);
  },
  subscribeGroups(cb) {
    return onSnapshot(doc(db, 'config', 'groups'), function (sn) {
      cb(sn.exists() ? sn.data() : {});
    }, function () {});
  },

  // 〇の並びを保存(メンバー本人用は updatedAt も書く。管理者の編集は slots だけ)
  setSlots(id, slots, asMember) {
    const patch = asMember ? { slots: slots, updatedAt: Date.now() } : { slots: slots };
    return updateDoc(doc(db, 'members', id), patch);
  },

  // 以下は管理者だけ(ルールで守られています)
  addMembers(list) {
    const batch = writeBatch(db);
    list.forEach(function (m) { batch.set(doc(collection(db, 'members')), m); });
    return batch.commit();
  },
  updateMember(id, patch) { return updateDoc(doc(db, 'members', id), patch); },
  deleteMember(id) { return deleteDoc(doc(db, 'members', id)); },
  saveGroups(obj) { return setDoc(doc(db, 'config', 'groups'), obj); },

  onAuth(cb) { return onAuthStateChanged(auth, cb); },
  signIn() { return signInWithPopup(auth, new GoogleAuthProvider()); },
  signOut() { return signOut(auth); }
};


(function () {
'use strict';
window.__nfStarted = true;

var SLOTS = [
  { d: 20, t: '朝礼' }, { d: 20, t: '10〜12' }, { d: 20, t: '12〜14' }, { d: 20, t: '14〜16' }, { d: 20, t: '16〜18' },
  { d: 21, t: '10〜12' }, { d: 21, t: '12〜14' }, { d: 21, t: '14〜16' }, { d: 21, t: '16〜18' },
  { d: 22, t: '10〜12' }, { d: 22, t: '12〜14' }, { d: 22, t: '14〜16' }, { d: 22, t: '16〜18' },
  { d: 23, t: '10〜12' }, { d: 23, t: '12〜14' }, { d: 23, t: '14〜16' }, { d: 23, t: '16〜18' },
  { d: 24, t: '午前中' }
];
var N = SLOTS.length, ZERO = new Array(N + 1).join('0');
var DAYS = [20, 21, 22, 23, 24];
var GKEYS = ['red', 'purple', 'blue', 'none'];
var GDEFAULT = { red: '赤', purple: '紫', blue: '青', none: '色なし' };

var app = document.getElementById('app');
var members = [], groupNames = Object.assign({}, GDEFAULT);
var loaded = false, loadErr = '', slow = false;
var overrides = {}, ws = {}, busy = 0, lastOkAt = 0;
var tab = 'me', editing = null, delAsk = null, rp = false, authUser = null;
var sel = readSel();

function readSel() { try { return localStorage.getItem('nf-shift-me') || ''; } catch (e) { return ''; } }
function writeSel(v) { try { if (v) localStorage.setItem('nf-shift-me', v); else localStorage.removeItem('nf-shift-me'); } catch (e) {} }

function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { s = typeof s === 'string' ? s : ''; return (s + ZERO).slice(0, N); }
function gname(k) { return groupNames[k] || GDEFAULT[k] || ''; }
function gkey(m) { return GKEYS.indexOf(m.group) >= 0 ? m.group : 'none'; }
function slotsOf(m) { return (m.id in overrides) ? overrides[m.id] : norm(m.slots); }

function ctx() {
  var counts = [], i;
  for (i = 0; i < N; i++) counts.push(0);
  var rows = members.map(function (m) {
    var s = slotsOf(m);
    for (var j = 0; j < N; j++) if (s[j] === '1') counts[j]++;
    return { m: m, s: s, entered: typeof m.updatedAt === 'number' };
  });
  var mine = rows.filter(function (r) { return r.m.id === sel; })[0] || null;
  return { counts: counts, rows: rows, mine: mine, enteredN: rows.filter(function (r) { return r.entered; }).length };
}

/* ---------- toast & status ---------- */
var tt;
function toast(msg, bad) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (bad ? ' bad' : '');
  clearTimeout(tt); tt = setTimeout(function () { t.className = 'toast'; }, 2800);
}
function errMsg(e, asMember) {
  var c = e && e.code;
  if (c === 'permission-denied') return asMember ? '保存できませんでした。管理者に連絡してください。' : 'この操作は管理者だけができます。管理者のIDがルールに登録されているか確認してください。';
  if (c === 'unavailable') return '通信できませんでした。電波を確認して、もう一度お試しください。';
  return '保存できませんでした。もう一度お試しください。';
}
function updStatus() {
  var el = document.getElementById('status'); if (!el) return;
  el.textContent = busy > 0 ? '保存中…' : (lastOkAt && Date.now() - lastOkAt < 4000 ? '保存しました' : '');
}
function act(promise, okMsg, asMember) {
  return promise.then(function () { if (okMsg) toast(okMsg); }).catch(function (e) { toast(errMsg(e, asMember), true); });
}

/* ---------- 〇の保存 ---------- */
function saveSlots(id, asMember) {
  var s = ws[id] || (ws[id] = { q: false, r: false, asMember: asMember });
  s.asMember = asMember;
  if (s.q) return;
  s.q = true;
  setTimeout(run, 300);
  function run() {
    if (s.r) { setTimeout(run, 200); return; }
    s.q = false;
    var val = overrides[id];
    if (val == null) return;
    s.r = true; busy++; updStatus();
    store.setSlots(id, val, s.asMember).then(function () {
      if (overrides[id] === val && !s.q) delete overrides[id];
      lastOkAt = Date.now();
    }).catch(function (e) {
      delete overrides[id]; toast(errMsg(e, s.asMember), true);
    }).then(function () {
      s.r = false; busy--; updStatus(); render(true);
      setTimeout(updStatus, 4200);
    });
  }
}
function setSlots(m, asMember, fn) {
  var cur = slotsOf(m).split('');
  fn(cur);
  overrides[m.id] = cur.join('');
  render(true); saveSlots(m.id, asMember);
}

/* ---------- 画面 ---------- */
function topbar(c) {
  var tabs = [['me', '自分の入力'], ['all', '全体の表']];
  if (authUser) tabs.push(['admin', '管理']);
  var meta = members.length ? ('メンバー ' + members.length + '人 ・ 本人入力済み ' + c.enteredN + '人') : '';
  return '<div class="bar gut"><div class="inner"><div class="top"><h1>ワッ局 NFシフト調整</h1><span class="meta">' + esc(meta) + '</span></div>' +
    '<div class="tabs" role="tablist">' + tabs.map(function (t) { return '<button class="tab" role="tab" aria-selected="' + (tab === t[0]) + '" data-act="tab" data-t="' + t[0] + '">' + t[1] + '</button>'; }).join('') + '</div></div></div>';
}
function notice(msg, bad) { return '<div class="notice' + (bad ? ' bad' : '') + '">' + esc(msg) + '</div>'; }

function viewMe(c) {
  var h = '';
  if (!c.mine) {
    h += '<section class="card"><h2>あなたの名前を選んでください</h2><p class="muted">選ぶと入力画面が開きます。この端末では、次からは自動で開きます。名前が見つからない場合は管理者に連絡してください。</p>' +
      '<div style="margin-top:12px"><input type="search" id="q" placeholder="名前で絞り込み" autocomplete="off" style="width:100%;max-width:320px"></div><div class="picks" id="picks">' +
      members.map(function (m) { return '<button class="pick g-' + gkey(m) + '" data-act="pick" data-mid="' + esc(m.id) + '" data-name="' + esc(m.name) + '">' + esc(m.name) + '</button>'; }).join('') + '</div>';
    if (!members.length) h += '<p class="muted">メンバーがまだ登録されていません。</p>';
    return h + '</section>';
  }
  var r = c.mine;
  h += '<div class="who"><div class="name">' + esc(r.m.name) + ' <span class="muted" style="font-size:14px;font-weight:400">さん</span></div>' +
    '<button class="btn" data-act="unpick">名前を選びなおす</button></div>' +
    '<p class="muted" style="margin:0 0 2px">入れる時間をタップして〇にしてください。変更は自動で保存されます。</p><div class="status" id="status" aria-live="polite"></div>';
  DAYS.forEach(function (d) {
    h += '<section class="day"><header><h2>' + d + '日</h2><div class="row"><button class="btn" data-act="dayon" data-d="' + d + '">すべて〇</button><button class="btn" data-act="dayoff" data-d="' + d + '">クリア</button></div></header><div class="slots">';
    SLOTS.forEach(function (s, i) {
      if (s.d !== d) return;
      var on = r.s[i] === '1';
      h += '<button class="slot" aria-pressed="' + on + '" data-act="slot" data-i="' + i + '"><span class="t">' + esc(s.t) + '</span><span class="mark" aria-hidden="true">' + (on ? '〇' : '—') + '</span><span class="n">' + (on ? '入れる' : '未選択') + ' ・ 現在' + c.counts[i] + '人</span></button>';
    });
    h += '</div></section>';
  });
  return h;
}

function viewAll(c) {
  if (!members.length) return '<div class="notice">メンバーがまだ登録されていません。管理者が「管理」から追加します。</div>';
  var h = '<div class="legend">' + GKEYS.map(function (k) { return '<span style="--gc:var(--g-' + k + ')"><i class="sw"></i>' + esc(gname(k)) + '</span>'; }).join('') +
    '<span><span class="dot" style="margin:0">●</span> 本人が入力済み</span></div>';
  h += '<div class="tablewrap"><table><thead><tr><th class="namecol" rowspan="3">名前</th>';
  DAYS.forEach(function (d) { var n = SLOTS.filter(function (s) { return s.d === d; }).length; h += '<th colspan="' + n + '">' + d + '日</th>'; });
  h += '</tr><tr>' + SLOTS.map(function (s) { return '<th>' + esc(s.t) + '</th>'; }).join('') + '</tr><tr>' + c.counts.map(function (n) { return '<th>' + n + '</th>'; }).join('') + '</tr></thead><tbody>';
  c.rows.forEach(function (r) {
    var isMe = c.mine && c.mine.m.id === r.m.id;
    h += '<tr' + (isMe ? ' class="me"' : '') + '><td class="namecol g-' + gkey(r.m) + '" title="' + esc(r.m.name) + '">' + esc(r.m.name) + (r.entered ? '<span class="dot" aria-label="本人入力済み">●</span>' : '') + '</td>';
    for (var i = 0; i < N; i++) h += (r.s[i] === '1' ? '<td class="on">〇</td>' : '<td></td>');
    h += '</tr>';
  });
  return h + '</tbody></table></div><p class="muted" style="margin-top:8px">上の数字は、その時間に入れる人数です。左右にスクロールできます。</p>';
}

function editGrid(r) {
  var h = '<div class="edgrid">';
  DAYS.forEach(function (d) {
    h += '<div class="d"><b>' + d + '日</b>';
    SLOTS.forEach(function (s, i) { if (s.d === d) h += '<button class="pill" aria-pressed="' + (r.s[i] === '1') + '" data-act="aslot" data-mid="' + esc(r.m.id) + '" data-i="' + i + '">' + esc(s.t) + '</button>'; });
    h += '</div>';
  });
  return h + '</div>';
}
function viewAdmin(c) {
  var h = '';
  if (!authUser) {
    return '<section class="card"><h2>管理者ログイン</h2><p class="muted">メンバーの追加・削除ができるのは、管理者のGoogleアカウントだけです。メンバーはログインしなくても入力できます。</p><div class="row"><button class="btn primary" data-act="login">Googleでログイン</button></div></section>';
  }
  h += '<section class="card"><h2>ログイン中</h2><p class="muted">下のIDが、Firebaseのルール(firestore.rules)に登録されている人だけが管理できます。まだ登録していない場合は、このIDをコピーしてルールに貼ってください。</p>' +
    '<div class="row"><input type="text" readonly id="myuid" value="' + esc(authUser.uid) + '" style="flex:1 1 240px" aria-label="あなたのID"><button class="btn" data-act="copyuid">コピー</button><button class="btn" data-act="logout">ログアウト</button></div></section>';
  h += '<section class="card"><h2>メンバーを追加</h2><p class="muted">追加した名前は、メンバーが最初に開いたときの選択肢に出ます。</p><div class="row"><input type="text" id="newName" placeholder="名前" autocomplete="off" style="flex:1 1 180px">' +
    '<select id="newGroup">' + GKEYS.map(function (k) { return '<option value="' + k + '">' + esc(gname(k)) + '</option>'; }).join('') + '</select><button class="btn primary" data-act="add">追加</button></div></section>';
  h += '<section class="card"><h2>まとめて追加</h2><p class="muted">1行に1人ずつ名前を書いて貼り付けます。色グループは全員同じになるので、あとで一覧から変えられます。</p><textarea id="bulk" rows="6" placeholder="例：&#10;山田 太郎&#10;佐藤 花子" style="width:100%"></textarea><div class="row" style="margin-top:8px"><select id="bulkGroup">' +
    GKEYS.map(function (k) { return '<option value="' + k + '">' + esc(gname(k)) + '</option>'; }).join('') + '</select><button class="btn primary" data-act="bulk">まとめて追加</button></div></section>';
  h += '<section class="card"><h2>メンバー一覧（' + c.rows.length + '人）</h2><p class="muted">名前や色は書き換えるとすぐ反映されます。「入力済み」は、本人が一度でも入力した人です。</p>';
  if (!c.rows.length) h += '<p class="muted">まだ誰もいません。</p>';
  c.rows.forEach(function (r) {
    var id = esc(r.m.id);
    h += '<div class="mrow"><div class="line"><input type="text" value="' + esc(r.m.name) + '" data-act="rename" data-mid="' + id + '" aria-label="名前"><select data-act="setgroup" data-mid="' + id + '" aria-label="色グループ">' +
      GKEYS.map(function (k) { return '<option value="' + k + '"' + (gkey(r.m) === k ? ' selected' : '') + '>' + esc(gname(k)) + '</option>'; }).join('') + '</select></div>' +
      '<div class="acts"><span class="tag' + (r.entered ? ' ok' : '') + '">' + (r.entered ? '入力済み' : '未入力') + '</span>' +
      '<button class="btn" data-act="edtoggle" data-mid="' + id + '">' + (editing === r.m.id ? '〇の編集を閉じる' : '〇を編集') + '</button>' +
      '<button class="btn danger" data-act="delask" data-mid="' + id + '">削除</button></div>';
    if (delAsk === r.m.id) h += '<div class="confirm bad"><span><b>' + esc(r.m.name) + '</b> さんを削除します。入力内容も消えます。</span><button class="btn danger fill" data-act="del_ok" data-mid="' + id + '">削除する</button><button class="btn" data-act="askcancel">やめる</button></div>';
    if (editing === r.m.id) h += editGrid(r);
    h += '</div>';
  });
  h += '</section>';
  h += '<section class="card"><h2>色グループの名前</h2><p class="muted">元の表の色分けです。役割の名前に書き換えてください。</p><div class="grid4">' +
    GKEYS.map(function (k) { return '<label style="display:grid;gap:4px;font-size:12px;color:var(--muted)"><span><i class="sw" style="display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--g-' + k + ');margin-right:4px"></i>色</span><input type="text" id="gn_' + k + '" value="' + esc(gname(k)) + '" maxlength="12"></label>'; }).join('') +
    '</div><div style="margin-top:10px"><button class="btn primary" data-act="savegroups">名前を保存</button></div></section>';
  h += '<section class="card"><h2>書き出し</h2><div class="row"><button class="btn" data-act="csv">CSVで保存</button></div></section>';
  return h;
}

function render(force) {
  var ae = document.activeElement;
  if (!force && ae && app.contains(ae) && /^(INPUT|SELECT|TEXTAREA)$/.test(ae.tagName)) { rp = true; return; }
  rp = false;
  var tw = app.querySelector('.tablewrap'), sl = tw ? tw.scrollLeft : 0, st = tw ? tw.scrollTop : 0;
  var c = ctx(), body = '';
  if (!store.configured) body = notice('firebase-config.js がまだ設定されていません。README.md のセットアップ手順の「Firebaseの設定を貼る」を行ってください。', true);
  else if (loadErr) body = notice('データを読み込めません（' + loadErr + '）。' + (loadErr === 'permission-denied' ? 'Firestoreのルールを公開したか確認してください。' : '通信を確認して、ページを開き直してください。'), true);
  else if (!loaded) body = '<p class="muted">' + (slow ? '接続に時間がかかっています。そのまま少し待つか、通信を確認してページを開き直してください。' : '読み込み中…') + '</p>';
  else if (tab === 'me') body = viewMe(c);
  else if (tab === 'all') body = viewAll(c);
  else if (tab === 'admin') body = viewAdmin(c);
  var foot = (!authUser && loaded) ? '<p class="muted" style="margin-top:28px;font-size:12px"><a href="#admin" data-act="gotoadmin">管理者の方はこちら</a></p>' : '';
  app.innerHTML = topbar(c) + '<main class="gut"><div class="inner">' + body + foot + '</div></main>';
  var nw = app.querySelector('.tablewrap'); if (nw) { nw.scrollLeft = sl; nw.scrollTop = st; }
  updStatus();
}

/* ---------- 操作 ---------- */
function mById(id) { return members.filter(function (m) { return m.id === id; })[0]; }
app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b || b.tagName === 'INPUT' || b.tagName === 'SELECT') return;
  var a = b.getAttribute('data-act'), mid = b.getAttribute('data-mid'), c = ctx(), m;
  if (a === 'gotoadmin') { e.preventDefault(); setTab('admin'); return; }
  if (a === 'tab') { setTab(b.getAttribute('data-t')); return; }
  if (a === 'pick') { sel = mid; writeSel(sel); render(true); return; }
  if (a === 'unpick') { sel = ''; writeSel(''); render(true); return; }
  if (a === 'slot' && c.mine) { var i = +b.getAttribute('data-i'); setSlots(c.mine.m, true, function (x) { x[i] = x[i] === '1' ? '0' : '1'; }); return; }
  if ((a === 'dayon' || a === 'dayoff') && c.mine) {
    var d = +b.getAttribute('data-d'), v = a === 'dayon' ? '1' : '0';
    setSlots(c.mine.m, true, function (x) { SLOTS.forEach(function (s, k) { if (s.d === d) x[k] = v; }); }); return;
  }
  if (a === 'login') { store.signIn().catch(function (er) { if (er && er.code !== 'auth/popup-closed-by-user' && er.code !== 'auth/cancelled-popup-request') toast('ログインできませんでした（' + (er.code || 'error') + '）。Firebaseの「承認済みドメイン」にこのサイトのドメインを追加したか確認してください。', true); }); return; }
  if (a === 'logout') { store.signOut().then(function () { tab = 'me'; render(true); }); return; }
  if (!authUser) return;
  if (a === 'copyuid') {
    var uidv = authUser.uid;
    var done = function () { toast('コピーしました'); };
    var fallback = function () { var el = document.getElementById('myuid'); if (el) { el.focus(); el.select(); } toast('IDを選択しました。コピーしてください'); };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(uidv).then(done).catch(fallback); else fallback();
    return;
  }
  if (a === 'add') {
    var nm = (document.getElementById('newName').value || '').trim(), g = document.getElementById('newGroup').value;
    if (!nm) { toast('名前を入力してください', true); return; }
    act(store.addMembers([{ name: nm, group: g, order: Date.now(), slots: ZERO }]), nm + ' さんを追加しました').then(function () { var el = document.getElementById('newName'); if (el) el.value = ''; render(true); }); return;
  }
  if (a === 'bulk') {
    var names = (document.getElementById('bulk').value || '').split(/\r?\n/).map(function (x) { return x.trim(); }).filter(Boolean);
    if (!names.length) { toast('名前を入力してください', true); return; }
    var bg = document.getElementById('bulkGroup').value, base = Date.now();
    act(store.addMembers(names.map(function (nm2, k) { return { name: nm2, group: bg, order: base + k, slots: ZERO }; })), names.length + '人を追加しました').then(function () { var el = document.getElementById('bulk'); if (el) el.value = ''; render(true); }); return;
  }
  if (a === 'edtoggle') { editing = editing === mid ? null : mid; render(true); return; }
  if (a === 'aslot') { m = mById(mid); if (!m) return; var j = +b.getAttribute('data-i'); setSlots(m, false, function (x) { x[j] = x[j] === '1' ? '0' : '1'; }); return; }
  if (a === 'delask') { delAsk = mid; render(true); return; }
  if (a === 'askcancel') { delAsk = null; render(true); return; }
  if (a === 'del_ok') { delAsk = null; act(store.deleteMember(mid), '削除しました').then(function () { if (editing === mid) editing = null; render(true); }); return; }
  if (a === 'savegroups') {
    var obj = {}; GKEYS.forEach(function (k) { var v2 = (document.getElementById('gn_' + k).value || '').trim(); obj[k] = v2 || GDEFAULT[k]; });
    act(store.saveGroups(obj), '保存しました'); return;
  }
  if (a === 'csv') {
    var q = function (s) { s = String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    var head = ['名前', '色グループ', '入力状況'].concat(SLOTS.map(function (s) { return s.d + '日 ' + s.t; }));
    var lines = [head.map(q).join(',')];
    c.rows.forEach(function (r) { lines.push([r.m.name, gname(gkey(r.m)), r.entered ? '入力済み' : '未入力'].concat(r.s.split('').map(function (x) { return x === '1' ? '〇' : ''; })).map(q).join(',')); });
    lines.push(['人数', '', ''].concat(c.counts).map(q).join(','));
    var blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' });
    var link = document.createElement('a'); link.href = URL.createObjectURL(blob); link.download = 'NFシフト.csv';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(link.href); }, 1000);
  }
});
app.addEventListener('change', function (e) {
  var t = e.target, a = t.getAttribute && t.getAttribute('data-act'); if (!a || !authUser) return;
  var mid = t.getAttribute('data-mid'), m = mById(mid); if (!m) return;
  if (a === 'rename') { var v = t.value.trim(); if (!v) { t.value = m.name; toast('名前は空にできません', true); return; } if (v !== m.name) act(store.updateMember(mid, { name: v }), '名前を変更しました'); }
  if (a === 'setgroup') { act(store.updateMember(mid, { group: t.value }), '色を変更しました'); }
});
app.addEventListener('keydown', function (e) {
  if (e.key === 'Enter' && e.target.id === 'newName') { e.preventDefault(); var b = app.querySelector('[data-act="add"]'); if (b) b.click(); }
  if (e.key === 'Enter' && e.target.getAttribute && e.target.getAttribute('data-act') === 'rename') e.target.blur();
});
app.addEventListener('input', function (e) {
  if (e.target.id !== 'q') return;
  var q = e.target.value.trim().toLowerCase();
  app.querySelectorAll('#picks .pick').forEach(function (b) { b.hidden = q && (b.getAttribute('data-name') || '').toLowerCase().indexOf(q) < 0; });
});
app.addEventListener('focusout', function () { setTimeout(function () { if (rp) render(); }, 300); });

function validTab(t) { return t === 'me' || t === 'all' || t === 'admin'; }
function setTab(t) { if (!validTab(t)) return; tab = t; if (location.hash !== '#' + t) location.hash = '#' + t; render(true); }
window.addEventListener('hashchange', function () { var t = location.hash.slice(1); if (validTab(t) && t !== tab) { tab = t; render(true); } });

/* ---------- 開始 ---------- */
var h0 = location.hash.slice(1);
if (validTab(h0)) tab = h0;
render(true);
if (store.configured) {
  setTimeout(function () { if (!loaded) { slow = true; render(); } }, 10000);
  store.onAuth(function (u) { authUser = u; render(); });
  store.subscribeMembers(function (list) { members = list; loaded = true; slow = false; loadErr = ''; render(); },
    function (er) { loadErr = (er && er.code) || 'error'; render(true); });
  store.subscribeGroups(function (g) { groupNames = Object.assign({}, GDEFAULT, g); render(); });
}
})();

</script>
<script>
setTimeout(function(){
  if(!window.__nfStarted){
    var a=document.getElementById('app');
    a.innerHTML='<main class="gut"><div class="inner"><div class="notice bad">ページを読み込めませんでした。通信を確認して、開き直してください。ファイルをパソコンで直接開いている場合は、GitHub Pagesの公開後のURLから開いてください。</div></div></main>';
  }
},6000);
</script>
</body>
